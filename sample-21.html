<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>两种点击图片放大效果</title>
<link href="css/main.css" rel="stylesheet" type="text/css">
<link href="css/21/main.css" rel="stylesheet" type="text/css">
</head>
<body>
<div id="content">
	<a id="example1" href="imgs/8/img0.jpg"><img src="imgs/8/img0.jpg" width="150"/></a>
	<a id="example2" href="imgs/8/img1.jpg"><img src="imgs/8/img1.jpg"  width="150" /></a>
</div>
<script src="js/21/jquery.min.js"></script>
<script src="js/21/jquery.imgbox.pack.js"></script>
<script>
$(function(){
	$("#example1").imgbox();
	$("#example2").imgbox({
		'speedIn'		: 0,
		'speedOut'		: 0,
		'alignment'		: 'center',
		'overlayShow'	: true,
		'allowMultiple'	: false
	});
});
</script>
<a id="back-home-link" href="index.html" style="position:fixed;left:16px;bottom:16px;z-index:99999;display:inline-block;padding:10px 18px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:#1a1a1a;color:#fff;font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:600;line-height:1.4;text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.35)">← 返回首页</a>
</body>
</html>
