<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Markdown 编辑器 · 隐喻与留白</title>
<link rel="stylesheet" href="./css/55/main.css">
<script src="./js/55/main.js" defer></script>
</head>
<body>
<div id="app" class="mode-split">
  <header class="app-header">
    <div class="header-row">
      <a class="tool-btn home-link" id="back-home-link" href="index.html" aria-label="返回首页" title="返回首页"></a>
      <button type="button" class="tool-btn" id="menuBtn" aria-label="文档列表"></button>
      <span class="header-spacer"></span>
      <span class="save-label" id="saveLabel" aria-live="polite"></span>
      <button type="button" class="tool-btn" id="paneBtn" aria-label="预览" title="预览" aria-pressed="false"></button>
      <button type="button" class="tool-btn" id="newBtn" aria-label="新建文章" title="新建文章"></button>
      <div class="export-wrap">
        <button type="button" class="tool-btn" id="exportBtn" aria-label="导出" title="导出" aria-haspopup="true" aria-expanded="false"></button>
        <div class="export-menu" id="exportMenu" hidden>
          <button type="button" data-export="md">导出 .md</button>
          <button type="button" data-export="html">导出 HTML</button>
          <button type="button" data-export="pdf">导出 PDF</button>
        </div>
      </div>
    </div>
    <div class="title-row">
      <input id="titleInput" class="title-input" aria-label="文件名" placeholder="untitled" spellcheck="false">
    </div>
  </header>


  <main class="panes" id="panes">
    <div class="editor-pane" id="editorPane">
      <textarea id="editor" aria-label="Markdown 编辑区" spellcheck="false" placeholder="在这里写 Markdown（支持粗体、斜体、列表、引用、链接、标题和脚注）…"></textarea>
    </div>
    <div class="pane-divider" id="paneDivider"></div>
    <div class="preview-pane" id="previewPane" aria-label="预览区">
      <div class="md-preview" id="preview"></div>
    </div>
  </main>

  <div class="welcome" id="welcome" hidden>
    <p class="welcome-title">还没有文档</p>
    <p class="welcome-text">新建一篇 untitled 开始写。支持完整 Markdown（标题、表格、任务列表、脚注），自动保存到本机浏览器，可导出为 .md、HTML 和 PDF。</p>
    <button type="button" class="welcome-new" id="welcomeNew">新建第一篇</button>
  </div>

  <footer class="statusbar" id="statusbar">
    <span id="charCount">0 字</span>
    <span id="lineCount">0 行</span>
    <span class="save-label-mini" id="saveLabelMini"></span>
    <span class="status-spacer"></span>
    <span class="status-note">本机演示 · 数据只存浏览器</span>
  </footer>

  <div class="toolbar-wrap" id="toolbarWrap">
    <div class="floating-toolbar capsule capsule-mobile" id="capsuleMobile"></div>
    <div class="floating-toolbar capsule capsule-desktop" id="capsuleDesktop"></div>
  </div>

  <div class="drawer-root" id="drawerRoot" hidden>
    <button type="button" class="drawer-backdrop" id="drawerBackdrop" aria-label="关闭文章列表"></button>
    <div class="drawer" role="dialog" aria-label="文档列表">
      <div class="drawer-head">
        <span class="drawer-title">文章</span>
        <button type="button" class="drawer-import" id="importBtn">导入 .md</button>
      </div>
      <ul class="drawer-list" id="drawerList"></ul>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <input type="file" id="importInput" accept=".md,text/markdown,text/plain" hidden>
</div>
</body>
</html>
